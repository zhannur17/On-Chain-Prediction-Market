specVersion: 1.0.0

schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: MarketFactory
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: MarketFactory
      startBlock: 0

    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript

      entities:
        - Market
        - Factory

      abis:
        - name: MarketFactory
          file: ./abis/MarketFactory.json

      eventHandlers:
        - event: MarketCreated(indexed address,indexed address,string,uint256)
          handler: handleMarketCreated

      file: ./src/mapping.ts