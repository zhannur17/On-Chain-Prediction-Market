specVersion: 1.0.0

schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: MarketFactory
    network: base-sepolia

    source:
      address: "0xf54dcBf5Cc6fDE628a55C07210735D0220154157"
      abi: MarketFactory
      startBlock: 41465284

    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript

      entities:
        - Market
        - Factory

      abis:
        - name: MarketFactory
          file: ../frontend/lib/abis/MarketFactory.json

      eventHandlers:
        - event: MarketCreated(indexed address,indexed address,string,uint256)
          handler: handleMarketCreated

      file: ./src/mapping.ts

templates:
  - kind: ethereum/contract
    name: PredictionMarket
    network: base-sepolia

    source:
      abi: PredictionMarket

    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript

      entities:
        - Market
        - Trade
        - Resolution

      abis:
        - name: PredictionMarket
          file: ../frontend/lib/abis/PredictionMarket.json

      eventHandlers:
        - event: SharesBought(indexed address,indexed bool,uint256,uint256,uint256)
          handler: handleSharesBought

        - event: MarketResolved(indexed bool)
          handler: handleMarketResolved

      file: ./src/mapping.ts