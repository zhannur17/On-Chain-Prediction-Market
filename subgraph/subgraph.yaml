specVersion: 1.0.0

schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: MarketFactory
    network: localhost

    source:
      address: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
      abi: MarketFactory
      startBlock: 0

    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript

      entities:
        - Market
        - Factory

      abis:
        - name: MarketFactory
          file: ../frontend/lib/abis/MarketFactory.json

      eventHandlers:
        - event: MarketCreated(indexed address,indexed address,string,uint256)
          handler: handleMarketCreated

      file: ./src/mapping.ts